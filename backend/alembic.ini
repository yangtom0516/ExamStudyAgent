# Alembic config. The database URL is NOT here: alembic/env.py reads it from app settings (.env).
# Run from the backend/ folder, e.g.  uv run alembic upgrade head

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# New migration files: 0002_add_courses.py style names are set by hand via --rev-id
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
